<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0c10;
    color: #f4f1ea;
  }

  #fit {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stage {
    position: relative;
    flex: 0 0 auto;
  }

  #game {
    position: absolute;
    left: 0;
    top: 0;
    width: 1792px;
    height: 1344px;
    display: grid;
    grid-template-columns: 29px 1730px 33px;
    grid-template-rows: 124px 43px 1143px 34px;
    transform-origin: top left;
    user-select: none;
  }

  #game img {
    display: block;
    image-rendering: pixelated;
  }

  .toolbar {
    grid-column: 1 / -1;
    display: flex;
    height: 124px;
  }

  .verb {
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    position: relative;
    flex: 0 0 auto;
  }

  .verb img {
    pointer-events: none;
  }

  .verb:hover img,
  .verb:focus-visible img {
    filter: brightness(1.22);
  }

  .verb:active img {
    filter: brightness(0.78);
  }

  .verb[aria-pressed="true"] img {
    filter: brightness(1.28) saturate(1.15);
  }

  .verb[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    inset: 10px 8px 12px;
    box-shadow: inset 0 0 0 3px #f0d48a;
    pointer-events: none;
  }

  .verb:focus-visible {
    outline: none;
  }

  .toolbar-fill {
    width: 723px;
    height: 124px;
  }

  .message {
    grid-column: 1 / -1;
    position: relative;
    height: 43px;
  }

  .message img {
    width: 1792px;
    height: 43px;
  }

  #line {
    position: absolute;
    left: 0;
    top: 0;
    width: 1792px;
    height: 43px;
    image-rendering: pixelated;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  #play {
    position: relative;
    overflow: hidden;
    background: #07080c;
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .character {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    z-index: 2;
    pointer-events: none;
    transform-origin: 0 0;
  }

  .character img {
    position: absolute;
    left: 0;
    top: 0;
    image-rendering: pixelated;
  }

  .hotspot {
    position: absolute;
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .spots {
    position: absolute;
    inset: 0;
  }

  #play:not(.verb-look) .hotspot {
    pointer-events: none;
  }

  #play.verb-walk .hotspot[data-enter] {
    pointer-events: auto;
  }

  .frame-left { width: 29px; height: 1143px; }
  .frame-right { width: 33px; height: 1143px; }
  .frame-bottom {
    grid-column: 1 / -1;
    width: 1792px;
    height: 34px;
  }
</style>
</head>

<script>
  const lines = {
    look: "Look at…",
    talk: "Talk to…",
    walk: "Walk to…",
    take: "Take…",
    use: "Use…",
    search: "Search…",
    give: "Give…",
    point: "Point at…"
  };

  const canvas = document.getElementById("line");
  const lineText = document.getElementById("line-text");
  const ctx = canvas.getContext("2d");
  const atlas = new Image();
  atlas.src = "ui/font-atlas.png";

  function drawLine(text) {
    lineText.textContent = text;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!atlas.complete || !atlas.naturalWidth) return;
    ctx.imageSmoothingEnabled = false;
    const scale = 24 / FONT.capHeight;
    const tracking = 20 * scale;
    const baseline = 33;
    let x = 24;
    for (const ch of text) {
      const glyph = FONT.glyphs[ch];
      if (!glyph) {
        x += 10;
        continue;
      }
      if (glyph.space) {
        x += glyph.w * scale;
        continue;
      }
      const dw = Math.max(1, Math.round(glyph.w * scale));
      const dh = Math.max(1, Math.round(glyph.h * scale));
      const dy = Math.round(baseline - (glyph.baseline - glyph.y) * scale);
      ctx.drawImage(atlas, glyph.x, glyph.y, glyph.w, glyph.h, Math.round(x), dy, dw, dh);
      x += dw + tracking;
    }
  }

  const verbs = [...document.querySelectorAll(".verb")];

  const play = document.getElementById("play");
  let verb = null;

  function select(button) {
    for (const other of verbs) {
      other.setAttribute("aria-pressed", other === button ? "true" : "false");
    }
    verb = button.dataset.verb;
    play.classList.toggle("verb-look", verb === "look");
    play.classList.toggle("verb-walk", verb === "walk");
    drawLine(lines[verb]);
  }

  for (const verb of verbs) {
    verb.addEventListener("click", () => select(verb));
  }

  const order = verbs.map((verb) => verb.dataset.verb);
  const held = new Set();
  window.addEventListener("keydown", (event) => {
    const index = "12345678".indexOf(event.key);
    if (index >= 0) {
      event.preventDefault();
      select(verbs[index]);
      return;
    }
    const key = event.key.toLowerCase();
    if (key === "w" || key === "a" || key === "s" || key === "d") {
      held.add(key);
      event.preventDefault();
    }
  });
  window.addEventListener("keyup", (event) => {
    held.delete(event.key.toLowerCase());
  });
  window.addEventListener("blur", () => held.clear());

  const game = document.getElementById("game");
  const stage = document.getElementById("stage");
  function fit() {
    const scale = Math.min(window.innerWidth / 1792, window.innerHeight / 1344);
    game.style.transform = "scale(" + scale + ")";
    stage.style.width = Math.floor(1792 * scale) + "px";
    stage.style.height = Math.floor(1344 * scale) + "px";
  }
  window.addEventListener("resize", fit);
  fit();
  atlas.onload = () => drawLine(lineText.textContent);
  if (atlas.complete) drawLine(lineText.textContent);

  // Walkable floor in play-area pixels (1730×1143).
  const grounds = {
    clearing: [
      [13, 1070],
      [423, 836],
      [560, 748],
      [504, 683],
      [256, 667],
      [282, 652],

      [1253, 651],

    house: [

    ],
    forest: [

      [1516, 851],

      [594, 806],
      [409, 807],
      [272, 818],
      [205, 860],
      [336, 930],
      [245, 978],
      [139, 994]
    ]
  };
  const places = {
    clearing: {
      src: "scenes/observatory.png",
      alt: "Dusk at a cedar pavilion above a river, with a stone path, a well, a waterfall, and a thin moon over violet mountains.",
      arrive: [1000, 820],
      line: "The night is wider out here, and the path still knows you."
    },
    house: {
      src: "scenes/house.png",
      alt: "Inside a quiet cedar room: a paper lantern, a low table set for two, and a moonlit window.",
      arrive: [860, 1080],
      line: "The little house is quiet tonight."

    forest: {

      alt: "The stone path continues south between cedars, under the same thin moon and violet mountains.",
      arrive: [880, 840],
      line: "The path goes on south, and the trees take the sky."
    }
  };
  let place = "clearing";
  let ground = grounds.clearing;
  let pending = null;
  let pendingArrive = null;
  // False while the feet are still standing in the exit they just came through.
  let exitOpen = true;

  // Feet inside this polygon, on the steps, enter the house.
  const feetExits = {
    clearing: [
      {
        to: "house",
        polygon: [
          [990, 542],

        ]
      }

  };

  function exitAt(x, y) {
    for (const exit of feetExits[place] || []) {
      if (inside(x, y, exit.polygon)) return exit.to;
    }
    const covered = new Set((feetExits[place] || []).map((exit) => exit.to));
    const layer = play.querySelector('.spots[data-scene="' + place + '"]');
    if (layer) {
      for (const spot of layer.querySelectorAll(".hotspot[data-enter]")) {
        if (covered.has(spot.dataset.enter)) continue;
        const left = parseFloat(spot.style.left) / 100 * PLAY_W;
        const top = parseFloat(spot.style.top) / 100 * PLAY_H;
        const width = parseFloat(spot.style.width) / 100 * PLAY_W;
        const height = parseFloat(spot.style.height) / 100 * PLAY_H;
        if (x >= left && x < left + width && y >= top && y < top + height) return spot.dataset.enter;
      }
    }
    return null;
  }

  function enterByFeet(dest) {
    const leavingForest = place === "forest" && dest === "clearing";
    pendingArrive = leavingForest ? [760, 1080] : null;
    showPlace(dest);
  }

  function inside(x, y, polygon) {
    let hit = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const [xi, yi] = polygon[i];
      const [xj, yj] = polygon[j];
      const crosses = (yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
      if (crosses) hit = !hit;
    }
    return hit;
  }

  function closestOnGround(x, y) {
    if (inside(x, y, ground)) return [x, y];
    let best = ground[0];
    let bestDist = Infinity;
    for (let i = 0; i < ground.length; i++) {
      const [ax, ay] = ground[i];
      const [bx, by] = ground[(i + 1) % ground.length];
      const abx = bx - ax;
      const aby = by - ay;
      const t = Math.max(0, Math.min(1, ((x - ax) * abx + (y - ay) * aby) / (abx * abx + aby * aby)));
      const px = ax + abx * t;
      const py = ay + aby * t;
      const dist = (px - x) ** 2 + (py - y) ** 2;
      if (dist < bestDist) {
        bestDist = dist;
        best = [px, py];
      }
    }
    return best;
  }

  // A point on an edge counts. The ray test misses some of those.
  function onGroundPoint(x, y) {
    if (inside(x, y, ground)) return true;
    const [px, py] = closestOnGround(x, y);
    return (px - x) ** 2 + (py - y) ** 2 <= 4;
  }

  // The stance, not a single sole point. It grows with the figure.
  function onGround(x, y) {
    const scale = window.actor ? window.actor.scale : 1;
    const halfW = Math.max(8, 12 * scale);
    const halfH = Math.max(3, 4 * scale);
    for (const px of [x - halfW, x, x + halfW]) {
      for (const py of [y - halfH, y + halfH]) {
        if (!onGroundPoint(px, py)) return false;
      }
    }
    return true;
  }

  // Keep the feet inside. A blocked diagonal still slides along one axis.
  function stepInside(x, y, nx, ny) {
    if (onGround(nx, ny)) return [nx, ny];
    if (onGround(nx, y)) return [nx, y];
    if (onGround(x, ny)) return [x, ny];
    return [x, y];
  }

  const PLAY_W = 1730;
  const PLAY_H = 1143;
  let hero = null;
  let goal = null;
  let last = 0;

  // Wanderer frames are about 170px tall. Twice that matches the height
  // the scene was staged for.
  function depthScale(y) {
    if (place === "house") {
      // 3.3 at the back of the floor (y ≈ 889). The near floor grows from there.
      const t = Math.max(0, Math.min(1, (y - 889) / 246));
      return 3.3 + t * 0.9;
    }
    if (place === "forest") {
      // Far stones (y ≈ 640) are small. The near path (y ≈ 1135) is full size.
      const t = Math.max(0, Math.min(1, (y - 620) / 515));
      return 0.85 + t * 1.9;
    }
    // 1.4 at the far path (y ≈ 623). The near grass grows from there.
    const t = Math.max(0, Math.min(1, (y - 623) / 512));
    return 1.4 + t * 1.2;
  }

  const scene = document.getElementById("scene");
  const sceneCtx = scene.getContext("2d");
  const plates = {};

  // One palette for every room and the figure, the way a VGA adventure
  // locked the whole picture to a few dozen colors. Ordered dither keeps
  // the dusk gradients from turning into flat bands.
  const COLOR_COUNT = 40;
  const BAYER = [
    0, 8, 2, 10,
    12, 4, 14, 6,
    3, 11, 1, 9,
    15, 7, 13, 5
  ];

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Could not load " + src));
      img.src = src;
    });
  }

  function sampleColors(source, step) {
    const width = source.naturalWidth || source.width;
    const height = source.naturalHeight || source.height;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.ceil(width / step));
    canvas.height = Math.max(1, Math.ceil(height / step));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const colors = [];
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i + 3] < 128) continue;
      colors.push([pixels[i], pixels[i + 1], pixels[i + 2]]);
    }
    return colors;
  }

  function medianCut(colors, count) {
    let boxes = [colors];
    while (boxes.length < count) {
      let pick = 0;
      let range = -1;
      for (let i = 0; i < boxes.length; i++) {
        const box = boxes[i];
        if (box.length < 2) continue;
        const span = channelSpan(box);
        if (span.range > range) {
          range = span.range;
          pick = i;
        }
      }
      if (range < 2) break;
      const box = boxes[pick];
      const channel = channelSpan(box).channel;
      box.sort((a, b) => a[channel] - b[channel]);
      const mid = Math.floor(box.length / 2);
      boxes.splice(pick, 1, box.slice(0, mid), box.slice(mid));
    }
    return boxes.map((box) => {
      let r = 0;
      let g = 0;
      let b = 0;
      for (const color of box) {
        r += color[0];
        g += color[1];
        b += color[2];
      }
      const n = box.length || 1;
      return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    });
  }

  function channelSpan(box) {
    const min = [255, 255, 255];
    const max = [0, 0, 0];
    for (const color of box) {
      for (let c = 0; c < 3; c++) {
        if (color[c] < min[c]) min[c] = color[c];
        if (color[c] > max[c]) max[c] = color[c];
      }
    }
    let channel = 0;
    let range = max[0] - min[0];
    for (let c = 1; c < 3; c++) {
      const span = max[c] - min[c];
      if (span > range) {
        range = span;
        channel = c;
      }
    }
    return { channel, range };
  }

  function paintPlate(img, palette) {
    const plate = document.createElement("canvas");
    plate.width = PLAY_W;
    plate.height = PLAY_H;
    const ctx = plate.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, PLAY_W, PLAY_H);
    const data = ctx.getImageData(0, 0, PLAY_W, PLAY_H);
    const pixels = data.data;
    const lut = colorLut(palette);
    const spread = 22;
    for (let y = 0; y < PLAY_H; y++) {
      for (let x = 0; x < PLAY_W; x++) {
        const o = (y * PLAY_W + x) * 4;
        const shake = (BAYER[(y & 3) * 4 + (x & 3)] - 7.5) * (spread / 16);
        const r = Math.max(0, Math.min(255, pixels[o] + shake));
        const g = Math.max(0, Math.min(255, pixels[o + 1] + shake));
        const b = Math.max(0, Math.min(255, pixels[o + 2] + shake));
        const color = palette[lut[(r >> 3) | ((g >> 3) << 5) | ((b >> 3) << 10)]];
        pixels[o] = color[0];
        pixels[o + 1] = color[1];
        pixels[o + 2] = color[2];
      }
    }
    ctx.putImageData(data, 0, 0);
    return plate;
  }

  function showPlace(id) {
    const next = places[id];
    place = id;
    ground = grounds[id];
    pending = null;
    goal = null;
    const spot = pendingArrive || next.arrive;
    pendingArrive = null;
    if (plates[next.src]) sceneCtx.drawImage(plates[next.src], 0, 0);
    scene.setAttribute("aria-label", next.alt);
    for (const layer of play.querySelectorAll(".spots")) {
      layer.hidden = layer.dataset.scene !== id;
    }
    reading = null;
    drawLine(next.line);
    if (hero) {
      hero.play("idle").position(spot[0], spot[1]).setScale(depthScale(spot[1]));
    }
    exitOpen = false;
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    const ax = (held.has("d") ? 1 : 0) - (held.has("a") ? 1 : 0);
    const ay = (held.has("s") ? 1 : 0) - (held.has("w") ? 1 : 0);
    if (hero && (ax || ay)) {
      goal = null;
      pending = null;
      const len = Math.hypot(ax, ay);
      const step = 260 * dt;
      const [nx, ny] = stepInside(hero.x, hero.y, hero.x + (ax / len) * step, hero.y + (ay / len) * step);
      hero.position(nx, ny).setScale(depthScale(ny));
      const clip = Math.abs(ay) > Math.abs(ax)
        ? (ay < 0 ? "walk-up" : "walk-down")
        : "walk";
      if (clip === "walk") hero.face(ax);
      else hero.face(1);
      if (hero.animationName !== clip) hero.play(clip);
      const dest = exitAt(nx, ny);
      if (!dest) exitOpen = true;
      else if (exitOpen) enterByFeet(dest);
    } else if (hero && goal) {
      const dx = goal[0] - hero.x;
      const dy = goal[1] - hero.y;
      const dist = Math.hypot(dx, dy);
      const step = 260 * dt;
      const [nx, ny] = dist <= step
        ? stepInside(hero.x, hero.y, goal[0], goal[1])
        : stepInside(hero.x, hero.y, hero.x + (dx / dist) * step, hero.y + (dy / dist) * step);
      const moved = nx !== hero.x || ny !== hero.y;
      const arrived = Math.hypot(goal[0] - nx, goal[1] - ny) <= 1;
      if (!moved || arrived) {
        if (moved) hero.position(nx, ny).setScale(depthScale(ny));
        hero.play("idle");
        goal = null;
        if (arrived && pending) showPlace(pending);
        else pending = null;
      } else {
        hero.position(nx, ny).setScale(depthScale(ny));
        const clip = Math.abs(dy) > Math.abs(dx)
          ? (dy < 0 ? "walk-up" : "walk-down")
          : "walk";
        if (clip === "walk") {
          if (Math.abs(dx) > 1) hero.face(dx);
        } else {
          hero.face(1);
        }
        if (hero.animationName !== clip) hero.play(clip);
      }
    } else if (hero && (hero.animationName === "walk" || hero.animationName === "walk-up" || hero.animationName === "walk-down")) {
      hero.play("idle");
    }
    if (hero && !exitAt(hero.x, hero.y)) exitOpen = true;
    if (hero) hero.update(dt);
    requestAnimationFrame(tick);
  }

  play.addEventListener("click", (event) => {
    if (event.target.closest(".hotspot")) return;
    if (!hero || verb !== "walk") {
      if (verb === "look") read(place === "house" ? "house" : place === "forest" ? "forest" : "grass");
      return;
    }
    pending = null;
    const rect = play.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * PLAY_W;
    const y = ((event.clientY - rect.top) / rect.height) * PLAY_H;
    goal = closestOnGround(x, y);
  });

  let reading = null;

  function read(id) {
    const pages = WORLD[id];
    if (!pages) return;
    const index = reading && reading.id === id ? (reading.index + 1) % pages.length : 0;
    reading = { id, index };
    const more = index < pages.length - 1 ? " …" : "";
    drawLine(pages[index] + more);
  }

  for (const spot of play.querySelectorAll(".hotspot")) {
    spot.addEventListener("pointerenter", () => {
      if (verb !== "look") return;
      reading = null;
      drawLine("Look at " + spot.dataset.name);
    });
    spot.addEventListener("pointerleave", () => {
      if (verb === "look" && lineText.textContent.startsWith("Look at ")) {
        reading = null;
        drawLine(lines.look);
      }
    });
    spot.addEventListener("click", () => {
      if (verb === "look") read(spot.dataset.id);
      if (verb === "walk" && spot.dataset.enter && hero) {
        const dest = spot.dataset.enter;
        const leavingForest = place === "forest" && dest === "clearing";
        const at = dest === "house" ? [1070, 540]
          : dest === "forest" ? [760, 1100]
          : leavingForest ? [880, 660]
          : [860, 1100];
        pending = dest;
        pendingArrive = leavingForest ? [760, 1080] : null;
        goal = closestOnGround(at[0], at[1]);
        drawLine(dest === "house" ? "Walk to the observatory"
          : dest === "forest" ? "Walk south along the path"
          : "Walk to the way out");
      }
    });
  }

  select(document.querySelector('[data-verb="walk"]'));

  Promise.all([
    loadImage(places.clearing.src),
    loadImage(places.house.src),
    loadImage(places.forest.src),
    Character.load("characters/wanderer/character.json?v=ext3")
  ]).then(([clearing, house, forest, actor]) => {
    const colors = sampleColors(clearing, 14)
      .concat(sampleColors(house, 14))
      .concat(sampleColors(forest, 14))
      .concat(sampleColors(actor.atlas, 2));
    const palette = medianCut(colors, COLOR_COUNT);
    plates[places.clearing.src] = paintPlate(clearing, palette);
    plates[places.house.src] = paintPlate(house, palette);
    plates[places.forest.src] = paintPlate(forest, palette);
    sceneCtx.drawImage(plates[places.clearing.src], 0, 0);
    actor.limitColors(palette);
    hero = actor;
    window.actor = actor;
    play.append(hero.element);
    hero.play("idle").position(1000, 740).setScale(depthScale(740)).face(1);
  });

  requestAnimationFrame(tick);
</script>
</body>
</html>
